name: v4 site → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "v4/site/**"
      - "v4/README.md"
      - "v4/SESSION_LOG.md"
      - "v4/PACKAGING_PLAN.md"
      - "v4/LAYOUT_TRANSCRIPTION.md"
      - "v4/CATALOG_INDEX.md"
      - "v4/PIPELINE.md"
      - "v4/MACHINES.md"
      - "v4/TUNER.md"
      - "v4/LIMITATIONS.md"
      - "v4/docs/**"
      - "v4/example_renders/**"
      - "v5/**"
      - "v4/lib/**"
      - "v4/config/**"
      - "v4/generate.py"
      - "v4/type_test.py"
      - "v4/generate_legend.py"
      - "v4/font_coverage.py"
      - ".github/workflows/v4-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: v4-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: v4/site

      - name: Sync docs into site source
        run: ./sync_docs.sh
        working-directory: v4/site

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ../../_site
        working-directory: v4/site
        env:
          JEKYLL_ENV: production

      # v5's UI is plain static files - published as-is at /app/. It talks to
      # an engine on the visitor's own computer (v5/server.py) until the
      # in-browser engine exists; see v5/ENGINE_API.md.
      - name: Add the v5 web app at /app/
        run: |
          mkdir -p _site/app
          cp -r v5/ui/. _site/app/
          rm -rf _site/app/_engine
          # the in-browser engine: v4's code + configs, engine_core, the
          # browser adapters and bundled fonts (see v5/browser/make_bundle.py)
          python3 v5/browser/make_bundle.py _site/app/_engine
          # cache-busting: every app file reference gets ?v=<commit>, so a
          # deploy is never served from a visitor's stale browser cache
          python3 v5/browser/stamp_version.py _site/app "${GITHUB_SHA::10}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          cname: type-elements.leonardchau.com
