  <script>
    // GitHub Pages lets browsers reuse this page for 10 minutes, and with it
    // the previous deploy's file versions. Ask (uncached) which deploy is
    // live and reload once if it's newer. The deploy fills in the version.
    (function () {
      var mine = "5e0aa7b0fb";
      if (mine.indexOf("__") === 0) return;   // not a deployed copy
      fetch("version.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.v && d.v !== mine && sessionStorage.getItem("te.reloadedFor") !== d.v) {
          sessionStorage.setItem("te.reloadedFor", d.v);
          location.reload();
        }
      }).catch(function () {});
    })();
  </script>
