title: Type Elements
description: >-
  Make 3D-printable typewriter type elements - IBM Selectric balls,
  Blickensderfer wheels, Hammond shuttles and more - from any font.
  Pick a machine, choose a typeface, preview the element in 3D and
  export a print-ready STL.
# Link previews (Discord, Slack, iMessage, social): jekyll-seo-tag turns
# `image` into og:image/twitter:image; `twitter.card` makes it the large
# image card. Size/alt/accent colour are in _includes/head.html.
image: /assets/og/type-elements-card.png
twitter:
  card: summary_large_image
url: "https://type-elements.leonardchau.com"
baseurl: ""
theme: minima
markdown: kramdown
permalink: pretty

minima:
  skin: dark
  date_format: "%Y-%m-%d"

header_pages:
  - v5.md
  - how-it-works.md
  - machines.md
  - accessories.md
  - behind-the-scenes.md
  - layout-transcription.md
  - catalog-index.md
  - roadmap.md
  - changelog.md
  - readme.md
  - license.md

# Footer licence line, rendered by _includes/footer.html. Kept here
# rather than in the template so the wording is a config edit. The site
# serves downloadable STLs, so the non-commercial term needs to be
# visible on every page, not only in the repo's LICENSE files.
license:
  copyright: "© 2023-2026 Leonard Chau"
  code: "GPL-3.0-or-later"
  code_url: "https://github.com/dairyking98/Type-Elements/blob/main/LICENSE"
  designs: "CC BY-NC-SA 4.0"
  designs_url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"

# Off-site nav entries, appended after header_pages by
# _includes/header.html. The project story (collaborators, real prints,
# the machines) lives on the main site; this one is the technical docs.
external_nav:
  # v5's web app, published alongside this site at /app/ by the deploy
  # workflow (copied from v5/ui/, not a Jekyll page - hence listed here).
  - title: "Open the app"
    url: "/app/"
  - title: "Project Story ↗"
    url: "https://leonardchau.com/projects/type-elements/"

exclude:
  - sync_docs.sh
  - Gemfile
  - Gemfile.lock
  - vendor/
