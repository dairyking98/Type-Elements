title: v4 Type Elements
description: >-
  Minkowski-draft type element pipeline for 3D-printed typewriter type
  elements - real manifold3d booleans, adaptive glyph outline sampling,
  and a config-driven port of every supported machine.
url: "https://type-elements.leonardchau.com"
baseurl: ""
theme: minima
markdown: kramdown
permalink: pretty

minima:
  skin: dark
  date_format: "%Y-%m-%d"

header_pages:
  - how-it-works.md
  - machines.md
  - accessories.md
  - behind-the-scenes.md
  - layout-transcription.md
  - catalog-index.md
  - roadmap.md
  - changelog.md
  - readme.md

# Off-site nav entries, appended after header_pages by
# _includes/header.html. The project story (collaborators, real prints,
# the machines) lives on the main site; this one is the technical docs.
external_nav:
  - title: "Project Story ↗"
    url: "https://leonardchau.com/projects/type-elements/"

exclude:
  - sync_docs.sh
  - Gemfile
  - Gemfile.lock
  - vendor/
